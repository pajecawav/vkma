<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="robots" content="noindex" />
		<title>vkma inspect</title>
		<!-- The tile reads on any tab strip; the raster is the fallback for
		     engines that take no SVG (Safari, Yandex). -->
		<link rel="icon" href="/icon.svg" type="image/svg+xml" />
		<link rel="icon" href="/favicon-96.png" sizes="96x96" type="image/png" />
		<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
		<script>
			// Theme before first paint (TopBar persists the preference in
			// localStorage under "vkma:theme", the same key every vkma
			// panel uses).
			try {
				if (localStorage.getItem("vkma:theme") === "dark") {
					document.documentElement.classList.add("dark");
				}
			} catch {}
		</script>
	</head>
	<body>
		<div id="root"></div>
	</body>
</html>
