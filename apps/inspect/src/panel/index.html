<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="robots" content="noindex" />
		<title>vkma inspect</title>
		<link rel="icon" href="/icon.svg" sizes="any" type="image/svg+xml" />
		<link rel="icon" href="/icon-dark.svg" sizes="any" type="image/svg+xml" media="(prefers-color-scheme: dark)" />
		<script>
			// Theme before first paint (TopBar persists the preference in
			// localStorage under "vkma:theme" — same key every vkma panel uses).
			try {
				if (localStorage.getItem("vkma:theme") === "dark") {
					document.documentElement.classList.add("dark");
				}
			} catch {}
		</script>
	</head>
	<body>
		<div id="root"></div>
	</body>
</html>
