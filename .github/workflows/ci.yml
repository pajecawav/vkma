name: CI

on:
    push:
        branches: [master]
    pull_request:
        branches: [master]

jobs:
    ci:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
              with:
                  submodules: recursive

            - uses: pnpm/action-setup@v6

            - uses: actions/setup-node@v7
              with:
                  node-version-file: .node-version
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Build
              run: pnpm build

            - name: Build inspector (firefox)
              run: pnpm --filter @vkma.dev/inspector build:firefox

            - name: Lint
              run: pnpm lint

            - name: Test
              run: pnpm test

            - name: Upload inspector artifacts
              uses: actions/upload-artifact@v7
              with:
                  name: inspector
                  path: apps/inspector/web-ext-artifacts/
                  if-no-files-found: error

            - name: Upload web artifact
              uses: actions/upload-artifact@v7
              with:
                  name: web
                  path: apps/web/dist/
                  if-no-files-found: error
