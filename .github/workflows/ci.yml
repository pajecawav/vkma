name: CI

on:
    push:
        branches: [master]
    pull_request:
        branches: [master]

permissions:
    contents: read

jobs:
    ci:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
              with:
                  submodules: recursive

            - uses: pnpm/action-setup@v6

            - uses: actions/setup-node@v7
              with:
                  node-version-file: .node-version
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Build
              run: pnpm build

            - name: Lint
              run: pnpm lint

            - name: Test
              run: pnpm test

            - name: Scaffold & build every create-app preset
              run: |
                  pnpm --filter @vkma.dev/create-app build
                  pnpm --filter @vkma.dev/create-app test:e2e

            # upload-artifact zips whatever it is handed, so a zip uploaded
            # the default way downloads as a zip inside a zip. archive: false
            # uploads the file as it is. The artifact is then named after
            # the file (the name input is ignored): vkma-devtools-<browser>-<version>.zip
            - name: Upload the firefox zip
              uses: actions/upload-artifact@v7
              with:
                  path: apps/devtools-extension/web-ext-artifacts/vkma-devtools-firefox-*.zip
                  archive: false
                  if-no-files-found: error

            - name: Upload the chrome zip
              uses: actions/upload-artifact@v7
              with:
                  path: apps/devtools-extension/web-ext-artifacts/vkma-devtools-chrome-*.zip
                  archive: false
                  if-no-files-found: error
