name: CI

on:
    push:
        branches: [master]
    pull_request:
        branches: [master]

jobs:
    ci:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
              with:
                  submodules: recursive

            - uses: pnpm/action-setup@v6

            - uses: actions/setup-node@v7
              with:
                  node-version-file: .node-version
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Build
              run: pnpm build

            - name: Lint
              run: pnpm lint

            - name: Test
              run: pnpm test

            - name: Scaffold & build every create-app preset
              run: |
                  pnpm --filter @vkma.dev/create-app build
                  pnpm --filter @vkma.dev/create-app test:e2e

            - name: Upload the firefox zip
              uses: actions/upload-artifact@v7
              with:
                  name: devtools-extension-firefox
                  path: apps/devtools-extension/web-ext-artifacts/vkma-devtools-firefox-*.zip
                  if-no-files-found: error

            - name: Upload the chrome zip
              uses: actions/upload-artifact@v7
              with:
                  name: devtools-extension-chrome
                  path: apps/devtools-extension/web-ext-artifacts/vkma-devtools-chrome-*.zip
                  if-no-files-found: error
